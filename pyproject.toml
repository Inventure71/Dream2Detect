[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream2detect"
version = "0.1.0"
description = "Synthetic-to-real package defect data tooling for Dream2Detect"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "openai>=2.32.0",
  "pandas>=2.2.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "scikit-learn>=1.4.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
