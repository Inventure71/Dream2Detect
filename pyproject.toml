[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream2detect"
version = "0.1.0"
description = "Synthetic-to-real package defect data tooling for Dream2Detect"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.32.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
